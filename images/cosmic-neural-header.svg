<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <!-- Deep space gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#1f6feb"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a371f7"/>
      <stop offset="100%" style="stop-color:#8957e5"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#238636"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f78166"/>
      <stop offset="100%" style="stop-color:#da3633"/>
    </linearGradient>

    <!-- Glow effects -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.5"/>
    </pattern>

    <!-- Circuit pattern -->
    <pattern id="circuit" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="2" fill="#30363d"/>
      <circle cx="100" cy="0" r="2" fill="#30363d"/>
      <circle cx="0" cy="100" r="2" fill="#30363d"/>
      <circle cx="100" cy="100" r="2" fill="#30363d"/>
      <circle cx="50" cy="50" r="2" fill="#30363d"/>
      <path d="M0,0 L50,50 M100,0 L50,50 M50,50 L50,100" stroke="#21262d" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.3"/>

  <!-- Decorative circuit lines -->
  <g stroke="#30363d" stroke-width="1" fill="none" opacity="0.5">
    <path d="M0,100 Q200,80 400,120 T800,100 T1200,120"/>
    <path d="M0,300 Q300,320 600,280 T1200,300"/>
  </g>

  <!-- Left side - Abstract brain/knowledge visualization -->
  <g transform="translate(150, 160)" filter="url(#softGlow)">
    <!-- Central hub -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#accentBlue)" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="url(#accentPurple)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="15" fill="#58a6ff" opacity="0.3"/>
    <circle cx="0" cy="0" r="8" fill="#58a6ff"/>

    <!-- Knowledge nodes -->
    <g filter="url(#glow)">
      <!-- Top nodes -->
      <circle cx="-50" cy="-60" r="6" fill="#a371f7"/>
      <circle cx="50" cy="-60" r="6" fill="#a371f7"/>
      <circle cx="0" cy="-80" r="5" fill="#8957e5"/>

      <!-- Side nodes -->
      <circle cx="-80" cy="-20" r="5" fill="#3fb950"/>
      <circle cx="-80" cy="20" r="5" fill="#3fb950"/>
      <circle cx="80" cy="-20" r="5" fill="#f78166"/>
      <circle cx="80" cy="20" r="5" fill="#f78166"/>

      <!-- Bottom nodes -->
      <circle cx="-50" cy="60" r="6" fill="#58a6ff"/>
      <circle cx="50" cy="60" r="6" fill="#58a6ff"/>
      <circle cx="0" cy="80" r="5" fill="#1f6feb"/>
    </g>

    <!-- Connections -->
    <g stroke-width="1" fill="none" opacity="0.4">
      <line x1="0" y1="0" x2="-50" y2="-60" stroke="#a371f7"/>
      <line x1="0" y1="0" x2="50" y2="-60" stroke="#a371f7"/>
      <line x1="0" y1="0" x2="0" y2="-80" stroke="#8957e5"/>
      <line x1="0" y1="0" x2="-80" y2="-20" stroke="#3fb950"/>
      <line x1="0" y1="0" x2="-80" y2="20" stroke="#3fb950"/>
      <line x1="0" y1="0" x2="80" y2="-20" stroke="#f78166"/>
      <line x1="0" y1="0" x2="80" y2="20" stroke="#f78166"/>
      <line x1="0" y1="0" x2="-50" y2="60" stroke="#58a6ff"/>
      <line x1="0" y1="0" x2="50" y2="60" stroke="#58a6ff"/>
      <line x1="0" y1="0" x2="0" y2="80" stroke="#1f6feb"/>

      <!-- Cross connections -->
      <line x1="-50" y1="-60" x2="0" y2="-80" stroke="#a371f7"/>
      <line x1="50" y1="-60" x2="0" y2="-80" stroke="#a371f7"/>
      <line x1="-80" y1="-20" x2="-50" y2="-60" stroke="#3fb950"/>
      <line x1="80" y1="-20" x2="50" y2="-60" stroke="#f78166"/>
    </g>

    <!-- Orbiting particles -->
    <circle r="3" fill="#58a6ff" opacity="0.8">
      <animateMotion dur="8s" repeatCount="indefinite" path="M0,-50 A50,50 0 1,1 0,50 A50,50 0 1,1 0,-50"/>
    </circle>
    <circle r="2" fill="#a371f7" opacity="0.8">
      <animateMotion dur="6s" repeatCount="indefinite" path="M0,-70 A70,70 0 1,0 0,70 A70,70 0 1,0 0,-70"/>
    </circle>
  </g>

  <!-- Right side - Document/research stack visualization -->
  <g transform="translate(1050, 160)">
    <!-- Stacked papers effect -->
    <g filter="url(#glow)">
      <rect x="-45" y="30" width="70" height="90" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" transform="rotate(-8)"/>
      <rect x="-40" y="20" width="70" height="90" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" transform="rotate(-4)"/>
      <rect x="-35" y="10" width="70" height="90" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>

      <!-- Document lines -->
      <g transform="translate(-35, 10)" stroke="#30363d" stroke-width="1">
        <line x1="10" y1="20" x2="60" y2="20"/>
        <line x1="10" y1="30" x2="55" y2="30"/>
        <line x1="10" y1="40" x2="50" y2="40"/>
        <line x1="10" y1="55" x2="60" y2="55"/>
        <line x1="10" y1="65" x2="45" y2="65"/>
        <line x1="10" y1="75" x2="55" y2="75"/>
      </g>

      <!-- Checkmark icon on document -->
      <circle cx="0" cy="-30" r="20" fill="#238636" opacity="0.2"/>
      <path d="M-8,-30 L-2,-24 L10,-36" stroke="#3fb950" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Floating elements -->
    <g opacity="0.6">
      <circle cx="-70" cy="-50" r="4" fill="#a371f7">
        <animate attributeName="cy" values="-50;-55;-50" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="-30" r="3" fill="#58a6ff">
        <animate attributeName="cy" values="-30;-25;-30" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-60" cy="70" r="3" fill="#3fb950">
        <animate attributeName="cy" values="70;75;70" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Center content -->
  <g transform="translate(600, 0)">
    <!-- Title -->
    <text x="0" y="100" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-1">
      Scientific Resources
    </text>
    <text x="0" y="135" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#8b949e" letter-spacing="2">
      AI • MACHINE LEARNING • DEEP LEARNING
    </text>

    <!-- Decorative line -->
    <line x1="-150" y1="160" x2="150" y2="160" stroke="url(#accentBlue)" stroke-width="2" opacity="0.5"/>

    <!-- Tagline -->
    <text x="0" y="190" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#58a6ff">
      Your comprehensive knowledge base for cutting-edge research
    </text>
  </g>

  <!-- Stats boxes - Bottom -->
  <g transform="translate(600, 310)">
    <!-- Box 1: Papers -->
    <g transform="translate(-340, 0)">
      <rect x="-70" y="-35" width="140" height="70" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
      <text x="0" y="-5" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#58a6ff">612+</text>
      <text x="0" y="20" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e" letter-spacing="1">PAPER REVIEWS</text>
    </g>

    <!-- Box 2: Categories -->
    <g transform="translate(-115, 0)">
      <rect x="-70" y="-35" width="140" height="70" rx="10" fill="#0d1117" stroke="#a371f7" stroke-width="2"/>
      <text x="0" y="-5" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#a371f7">23</text>
      <text x="0" y="20" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e" letter-spacing="1">CATEGORIES</text>
    </g>

    <!-- Box 3: Size -->
    <g transform="translate(115, 0)">
      <rect x="-85" y="-35" width="170" height="70" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
      <text x="0" y="-5" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#3fb950">1,496 PDFs</text>
      <text x="0" y="20" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e" letter-spacing="1">13 GB RESOURCES</text>
    </g>

    <!-- Box 4: Coverage -->
    <g transform="translate(340, 0)">
      <rect x="-70" y="-35" width="140" height="70" rx="10" fill="#0d1117" stroke="#f78166" stroke-width="2"/>
      <text x="0" y="-5" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#f78166">2022-26</text>
      <text x="0" y="20" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e" letter-spacing="1">COVERAGE</text>
    </g>
  </g>

  <!-- Corner decorations -->
  <g opacity="0.3">
    <!-- Top left -->
    <path d="M0,0 L80,0 L80,10 L10,10 L10,80 L0,80 Z" fill="none" stroke="#58a6ff" stroke-width="1"/>
    <!-- Top right -->
    <path d="M1200,0 L1120,0 L1120,10 L1190,10 L1190,80 L1200,80 Z" fill="none" stroke="#a371f7" stroke-width="1"/>
    <!-- Bottom left -->
    <path d="M0,400 L80,400 L80,390 L10,390 L10,320 L0,320 Z" fill="none" stroke="#3fb950" stroke-width="1"/>
    <!-- Bottom right -->
    <path d="M1200,400 L1120,400 L1120,390 L1190,390 L1190,320 L1200,320 Z" fill="none" stroke="#f78166" stroke-width="1"/>
  </g>

  <!-- Subtle floating particles -->
  <g fill="#58a6ff" opacity="0.4">
    <circle cx="300" cy="80" r="2">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="250" r="1.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="220" r="2">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="70" r="1.5">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
